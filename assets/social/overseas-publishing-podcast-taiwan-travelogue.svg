<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Overseas Publishing podcast cover for Taiwan Travelogue</title>
  <desc id="desc">A clean editorial cover for an Overseas Publishing audio briefing on Taiwan Travelogue, pseudo-translation and colonial memory.</desc>
  <defs>
