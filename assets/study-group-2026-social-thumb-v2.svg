<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">OTC Study Group 2026 Square Preview</title>
  <desc id="desc">A square Threads preview image for OTC Study Group 2026 pathway and direct-entry application screening.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a2f"/>
      <stop offset="56%" stop-color="#1f5e52"/>
      <stop offset="100%" stop-color="#b88a3b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f7f2ea"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.13"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#061a2f" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <g transform="translate(86 82)">
    <rect x="0" y="0" width="1028" height="1036" rx="38" fill="url(#paper)" filter="url(#shadow)"/>
    <rect x="42" y="42" width="944" height="252" rx="28" fill="#061a2f"/>
    <text x="86" y="112" fill="#d0ae67" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="5">OTC STUDY HUB</text>
    <text x="86" y="192" fill="#fffdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700">Study Group 2026</text>
    <text x="86" y="252" fill="#dbe7e2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">Pathway 與直入申請</text>

    <g transform="translate(86 376)">
      <text x="0" y="0" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="50" font-weight="740">全部申請免費代辦</text>
      <text x="0" y="68" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="34" font-weight="650">包括英國與美國項目</text>
      <text x="0" y="126" fill="#4d5968" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28">UK / Europe ISC · North America · Bellerbys Global</text>
    </g>

    <g transform="translate(86 602)">
      <rect x="0" y="0" width="258" height="144" rx="20" fill="#f7f2ea" stroke="#ded3c4"/>
      <rect x="288" y="0" width="258" height="144" rx="20" fill="#f7f2ea" stroke="#ded3c4"/>
      <rect x="576" y="0" width="258" height="144" rx="20" fill="#f7f2ea" stroke="#ded3c4"/>
      <text x="28" y="52" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">DOCUMENTS</text>
      <text x="28" y="96" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">成績單檢查</text>
      <text x="316" y="52" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">ROUTES</text>
      <text x="316" y="96" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">課程匹配</text>
      <text x="604" y="52" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">APPLY</text>
      <text x="604" y="96" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">申請評估</text>
