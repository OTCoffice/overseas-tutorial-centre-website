      .label{fill:#24364b;font-family:Arial,Helvetica,sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;opacity:.48}
      .small{fill:#34465c;font-family:Arial,Helvetica,sans-serif;font-size:6.6px;font-weight:700;letter-spacing:.07em;opacity:.42}
      .index{fill:#8b6b31;font-family:Arial,Helvetica,sans-serif;font-size:6px;font-weight:700;letter-spacing:.16em;opacity:.48}
    </style>
