<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OTC Study Group 2026 Applications Social Preview</title>
  <desc id="desc">A social media preview card for OTC Study Group 2026 pathway, direct-entry and North America university application screening.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="48%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#e6f0ec"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a2f"/>
      <stop offset="55%" stop-color="#1f5e52"/>
      <stop offset="100%" stop-color="#b88a3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#061a2f" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ded3c4" stroke-width="1" opacity="0.34"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="42" y="42" width="1116" height="591" rx="22" fill="#fffdf8" stroke="#ded3c4" filter="url(#shadow)"/>
  <rect x="70" y="72" width="1060" height="531" rx="18" fill="url(#grid)" opacity="0.68"/>

  <g transform="translate(88 94)">
    <rect x="0" y="0" width="410" height="486" rx="16" fill="url(#hero)"/>
    <text x="34" y="58" fill="#d0ae67" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">OTC STUDY HUB</text>
    <text x="34" y="114" fill="#fffdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="42" font-weight="650">Study Group</text>
    <text x="34" y="164" fill="#fffdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="42" font-weight="650">2026 申請</text>
    <text x="34" y="215" fill="#dbe7e2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21">Pathway · Direct Entry</text>
    <text x="34" y="250" fill="#dbe7e2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21">North America options</text>

    <g transform="translate(34 320)">
      <rect x="0" y="0" width="156" height="66" rx="10" fill="#fffdf8" opacity="0.92"/>
      <rect x="174" y="0" width="156" height="66" rx="10" fill="#fffdf8" opacity="0.92"/>
      <text x="18" y="28" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" letter-spacing="2">UK / EUROPE</text>
      <text x="18" y="50" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16">ISC routes</text>
      <text x="192" y="28" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" letter-spacing="2">NORTH AMERICA</text>
      <text x="192" y="50" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16">12 institutions</text>
    </g>
    <text x="34" y="452" fill="#fffdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16">Overseas Tutorial Centre Ltd</text>
  </g>

  <g transform="translate(548 112)">
    <text x="0" y="0" fill="#b88a3b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="3">2026 JULY-DECEMBER INTAKES</text>
    <text x="0" y="62" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="48" font-weight="650">Study Group route</text>
    <text x="0" y="120" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="48" font-weight="650">screening for students</text>
    <text x="0" y="176" fill="#4d5968" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22">UK / Europe ISC, Huddersfield London,</text>
    <text x="0" y="212" fill="#4d5968" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22">Royal Holloway, North America and Bellerbys Global.</text>

    <g transform="translate(0 292)">
      <rect x="0" y="0" width="580" height="148" rx="14" fill="#f7f2ea" stroke="#ded3c4"/>
      <text x="24" y="38" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="2">OTC CHECKS</text>
      <text x="24" y="78" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">成績單 · 英文證明 · 課程匹配 · 申請時間表</text>
      <text x="24" y="116" fill="#4d5968" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18">Public route information with an OTC application review form.</text>
    </g>

    <text x="0" y="500" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">overseasuk.com/zh/study-group-2026-applications/</text>
  </g>
