    <path d="M38 406C120 354 176 442 256 388S326 308 382 348" fill="none" stroke="#d0ae67" stroke-width="2.4" opacity="0.72"/>
    <path d="M34 300C120 256 192 330 282 286S346 236 382 252" fill="none" stroke="#f7f2ea" stroke-width="1.2" opacity="0.38"/>
    <path d="M42 170C134 132 178 214 268 174S340 112 382 142" fill="none" stroke="#f7f2ea" stroke-width="1.2" opacity="0.32"/>
    <g fill="#d0ae67">
