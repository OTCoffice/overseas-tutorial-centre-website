      <rect x="196" y="0" width="178" height="74" rx="10" fill="#f7f2ea" stroke="#ded3c4"/>
      <rect x="392" y="0" width="178" height="74" rx="10" fill="#f7f2ea" stroke="#ded3c4"/>
      <text x="20" y="30" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="2">SCREENING</text>
      <text x="20" y="54" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16">Course level</text>
      <text x="216" y="30" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="2">READINESS</text>
      <text x="216" y="54" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16">English + documents</text>
      <text x="412" y="30" fill="#1f5e52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="2">PROGRESSION</text>
      <text x="412" y="54" fill="#061a2f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16">TAFE to university</text>
