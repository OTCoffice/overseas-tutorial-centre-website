    <text x="34" y="192" fill="#dbe7e2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17">Vocational course screening</text>
    <text x="34" y="222" fill="#dbe7e2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17">TAFE-to-university progression</text>
