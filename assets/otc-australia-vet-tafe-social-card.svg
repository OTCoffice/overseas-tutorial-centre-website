<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OTC Australia VET and TAFE Pathway Map</title>
  <desc id="desc">A social media poster for OTC Australia vocational education pathway screening with website and contact details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="58%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#eaf2ee"/>
    </linearGradient>
    <linearGradient id="navyPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a2f"/>
      <stop offset="100%" stop-color="#1f5e52"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#061a2f" flood-opacity="0.16"/>
    </filter>
    <pattern id="microGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d8cdbd" stroke-width="0.8" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="40" y="38" width="1120" height="599" rx="22" fill="#fffdf8" stroke="#ded3c4" filter="url(#shadow)"/>
  <rect x="72" y="70" width="1056" height="535" rx="16" fill="url(#microGrid)" opacity="0.72"/>

  <g transform="translate(86 88)">
