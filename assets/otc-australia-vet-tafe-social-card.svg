      <circle cx="120" cy="256" r="3.5"/><circle cx="282" cy="286" r="3.5"/><circle cx="346" cy="236" r="3.5"/>
      <circle cx="134" cy="132" r="3.5"/><circle cx="268" cy="174" r="3.5"/><circle cx="340" cy="112" r="3.5"/>
    </g>
