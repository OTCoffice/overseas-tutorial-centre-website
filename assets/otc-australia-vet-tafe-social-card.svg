      <text x="0" y="34" fill="#4d5968" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16">office@overseasuk.com  |  WhatsApp +44 7947 991572  |  WeChat overseasus</text>
