name: Generate Europe mobility PNG cover
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-europe-mobility-cover.py'
      - '.github/workflows/europe-mobility-cover.yml'
permissions:
  contents: write
jobs:
  render-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python -m pip install --quiet Pillow
      - run: python scripts/generate-europe-mobility-cover.py
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/europe-mobility-36-us-study-style-20261115.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish approved Europe mobility PNG cover"
            git push
          fi
