<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美國私校 SSAT／ISEE 考試輔導｜OTC</title><meta name="description" content="SSAT 與 ISEE 考試比較、原創教材、能力診斷與私校申請輔導"><link rel="canonical" href="https://overseasuk.com/zh/exam-prep/"><link rel="stylesheet" href="../../styles.css"></head><body><main style="max-width:850px;margin:50px auto;padding:20px;line-height:1.9"><a href="/zh/study-planning/">← 課程與學習</a><h1>美國私立中學入學考試輔導</h1><p>先確認學校要求，再選擇考試。OTC 提供能力診斷、原創練習與申請規劃。</p><h2><a href="/zh/exam-prep/ssat/">SSAT 專項輔導</a></h2><p>詞彙同義詞、類比推理、閱讀及數學。</p><h2><a href="/zh/exam-prep/isee/">ISEE 專項輔導</a></h2><p>語文推理、數量推理、閱讀及數學成就。</p><h2>兩者怎麼選？</h2><p>先查目標學校是否接受 SSAT、ISEE 或不要求標準化考試；再按申請年級、學生強弱項與考期選擇。兩者不可視為完全相同。</p><p>教材借鑑 OTC 英國私校入學輔導教材的「診斷—分項—解析—限時演練」教學設計，但不混淆英美考試內容。</p><p><a href="mailto:office@overseasuk.com">聯絡 OTC：office@overseasuk.com</a></p></main></body></html>
